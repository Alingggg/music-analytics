# This is a Declarative Automation Bundle definition for music-analytics-pipeline.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: music-analytics-pipeline

include:
  - resources/*.yml

artifacts:
  pipeline_wheel:
    type: whl
    path: .
    build: uv build --wheel
    dynamic_version: true

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-43a24006-b540.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-43a24006-b540.cloud.databricks.com
