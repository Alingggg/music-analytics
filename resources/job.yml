resources:
  jobs:
    movie_pipeline:
      name: movie-pipeline
      tasks:
        - task_key: bronze
          python_wheel_task:
            package_name: music-analytics-pipeline
            entry_point: bronze
          environment_key: default

        - task_key: silver
          depends_on:
            - task_key: bronze
          python_wheel_task:
            package_name: music-analytics-pipeline
            entry_point: silver
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver
          python_wheel_task:
            package_name: music-analytics-pipeline
            entry_point: gold
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
